server:
  port: 8080

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/japanese_learning?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: "${MYSQL_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      database: 0
      timeout: 3000ms
  # DeepSeek AI（OpenAI 互換プロトコル）：api-key は環境変数のみから読み取る。git 追跡ファイルへの記入は厳禁
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# JWT 設定：secret は署名キー（任意の長い文字列）、expiration は有効期限（ミリ秒）
jwt:
  secret: "japanese-learning-secret-key-2026-keep-it-long"
  expiration: 8640000000   # 2400 時間（＝100 日）

url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/japanese_learning?...
host: ${REDIS_HOST:localhost}




